version: 2
updates:
  # Rust workspace (cwtools-rs/) — primary ecosystem.
  - package-ecosystem: "cargo"
    directory: "/cwtools-rs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    # MSRV is 1.88.0, declared in cwtools-rs/Cargo.toml. This used to be a note
    # asking for human review of MSRV bumps, guarding a value that didn't exist
    # yet. It does now, and the "Rust MSRV build" job in test.yml fails any
    # update whose own rust-version climbs past it, so a bump is a red check
    # rather than something a reviewer has to spot.
    labels:
      - "dependencies"
      - "rust"
    groups:
      # Keep patch updates from clobbering PR list; bundle into one weekly PR.
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Keep GitHub Actions pinned to recent versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      # Bundle patch and minor action updates to reduce PR noise.
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
