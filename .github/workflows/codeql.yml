name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Weekly scan to catch newly-published queries against existing code.
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  # event_name keeps a push to main from cancelling the weekly sweep.
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            paths: .github/workflows
          - language: rust
            paths: cwtools-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          paths: ${{ matrix.paths }}
          # security-extended over security-and-quality: no maintainability noise.
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
