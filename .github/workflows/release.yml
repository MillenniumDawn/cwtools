name: Release

on:
  # Push a v* tag to build and publish the release. workflow_dispatch is a
  # manual fallback for re-runs (off a tag ref it builds but skips publish).
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Never cancel an in-flight release; queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Default to least privilege; only publish widens to write. The build jobs
# compile dependency build scripts and proc macros, so they must not hold a
# repository-write credential.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------------
  # A v* tag is the only authorization this workflow gets, so check that the
  # tag points into protected main and carries a tagger (annotated, not a bare
  # ref) before anything builds or ships.
  # Defense in depth only: the real control is a ruleset on refs/tags/v* that
  # stops an unauthorized tag from being created in the first place (#158).
  # -------------------------------------------------------------------------
  verify-tag-ancestry:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing. merge-base --is-ancestor on a shallow
      # clone answers from grafted history, so a legitimate tag whose commit
      # sits below the cut fails the gate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag commit must be an ancestor of main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A workflow_dispatch off a branch builds without publishing, so
          # there is no tag to hold to main. Pass rather than skip: a skipped
          # job would skip everything that needs it.
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *)
              echo "$GITHUB_REF is not a tag; build-only run"
              exit 0
              ;;
          esac
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow --no-tags origin
          fi
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          # GITHUB_SHA, not the tag ref: that is the commit the build jobs
          # check out, and it is what a tag moved mid-run would diverge from.
          # ^{commit} dereferences an annotated tag object to its commit.
          commit="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor \
            "$commit" refs/remotes/origin/main; then
            echo "::error::tag ${TAG} points at ${commit}, which is not on" \
              "main; refusing to build or publish a release from it"
            exit 1
          fi
          echo "tag ${TAG} -> ${commit} is an ancestor of origin/main"

      # A lightweight tag is a bare ref: no tagger, no date, nothing to sign.
      # Requiring the annotated form is what makes the signing policy possible
      # at all (`git tag -s -a vX.Y.Z`). Whether a signature is *trusted* is
      # the ruleset's call, not this job's: the runner has no key material.
      - name: Tag must be annotated
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          objtype="$(git cat-file -t "refs/tags/${TAG}")"
          if [ "$objtype" != "tag" ]; then
            echo "::error::tag ${TAG} is a ${objtype}, not an annotated tag;" \
              "cut release tags with git tag -s -a ${TAG} -m ${TAG}"
            exit 1
          fi
          echo "tag ${TAG} is an annotated tag object"

  # -------------------------------------------------------------------------
  # Rust — matrix across all three platforms
  # -------------------------------------------------------------------------
  release-rs:
    name: ${{ matrix.label }}
    needs: [verify-tag-ancestry]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x86_64
            artifact: cwtools-rs-linux-x86_64
            strip: true
          # macos-latest runners are arm64; the host build is aarch64 and the
          # client vsix ships osx-arm64.
          - os: macos-latest
            label: macOS arm64
            artifact: cwtools-rs-macos-arm64
            strip: true
          # Windows is already stripped by [profile.release] strip = true
          # (rustc/LLVM). The post-build `strip` binary is a Unix-only extra
          # pass, so the matrix flag stays false here.
          - os: windows-latest
            label: Windows x86_64
            artifact: cwtools-rs-windows-x86_64
            strip: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cwtools-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain (stable)
        # stable
        uses: "dtolnay/rust-toolchain@29eef336d9b2848a0b54\
          8edc03f92a220660cdb8"

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            ${{ matrix.os }}-cargo-registry-${{
            hashFiles('cwtools-rs/Cargo.lock') }}

      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cwtools-rs/target
          key: >-
            ${{ matrix.os }}-cargo-target-${{
            hashFiles('cwtools-rs/Cargo.lock', 'cwtools-rs/**/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-target-
          save-always: true

      - name: cargo build --release
        run: cargo build --workspace --release

      # Both binaries are expected. A missing one used to be skipped quietly,
      # which left an archive holding just the CLI, and `if-no-files-found:
      # error` on the upload below was still satisfied by that archive. The
      # release shipped without the language server and nothing went red.
      - name: Strip + archive binaries
        shell: pwsh
        run: |
          $ext = if (
            '${{ matrix.os }}' -eq 'windows-latest'
          ) { '.exe' } else { '' }
          $extOut = if (
            '${{ matrix.os }}' -eq 'windows-latest'
          ) { '.zip' } else { '.tar.gz' }
          $expected = @('cwtools', 'cwtools-server')
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($bin in $expected) {
            $src = "target/release/${bin}${ext}"
            if (-not (Test-Path $src)) {
              throw (
                "release build produced no ${src}; " +
                "refusing to ship a partial archive"
              )
            }
            if ('${{ matrix.strip }}' -eq 'true') {
              # Extra Unix pass on top of cargo's release strip. Skipped on
              # Windows: no GNU strip on the runner; cargo already stripped.
              & strip $src
            }
            Copy-Item $src "dist/${bin}${ext}"
          }
          $staged = @(Get-ChildItem dist -File)
          if ($staged.Count -ne $expected.Count) {
            throw (
              "staged $($staged.Count) binaries, expected " +
              "$($expected.Count): $($staged.Name -join ', ')"
            )
          }
          if ($extOut -eq '.zip') {
            Compress-Archive -Path dist\* `
              -DestinationPath "${{ matrix.artifact }}.zip" -Force
          } else {
            tar -C dist -czf "${{ matrix.artifact }}.tar.gz" .
          }

      - name: Upload Rust binaries
        # v7
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: cwtools-rs/${{ matrix.artifact }}.*
          if-no-files-found: error

  # Run the release-profile suite separately so it overlaps the three platform
  # builds. The matrix still catches platform-specific release build failures.
  release-test:
    name: Rust release tests
    needs: [verify-tag-ancestry]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cwtools-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain (stable)
        # stable
        uses: "dtolnay/rust-toolchain@29eef336d9b2848a0b54\
          8edc03f92a220660cdb8"
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            ubuntu-latest-cargo-registry-${{
            hashFiles('cwtools-rs/Cargo.lock') }}
      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cwtools-rs/target
          key: >-
            ubuntu-latest-cargo-release-test-target-${{
            hashFiles('cwtools-rs/Cargo.lock', 'cwtools-rs/**/Cargo.toml') }}
          restore-keys: |
            ubuntu-latest-cargo-release-test-target-
          save-always: true
      - name: cargo test --release
        run: >-
          cargo test --workspace --all-features --release --no-fail-fast

  # ---------------------------------------------------------------------------
  # Publish the archives + checksums as the GitHub release for the pushed tag.
  # Skipped for a workflow_dispatch off a tag ref (build-only re-run).
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub release
    needs: [verify-tag-ancestry, release-rs, release-test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The only job that writes: `gh release create/upload` needs it.
    permissions:
      contents: write
    steps:
      - name: Download archives
        # v8.0.1
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a54\
          61e7c"
        with:
          pattern: cwtools-rs-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env rather than inline-interpolated into the script,
          # per GitHub's script-injection hardening guidance.
          TAG: ${{ github.ref_name }}
        # Idempotent for re-runs: upload into an existing release instead of
        # failing on create.
        run: |
          tag="$TAG"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber \
              -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" artifacts/* --verify-tag \
              --title "$tag" --generate-notes \
              -R "$GITHUB_REPOSITORY"
          fi
